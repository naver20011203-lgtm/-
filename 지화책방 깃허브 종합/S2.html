<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>知花冊房</title>
  <meta name="description" content="지화책방 비주얼 노벨">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #000;
    }

    .sr-only {
      position: absolute; width: 1px; height: 1px;
      overflow: hidden; clip: rect(0 0 0 0);
    }

    /* 12.9인치 가로 기준 스테이지 (1366 x 1024) — 다른 비율 기기에서는 중앙 배치 및 레터박스(검정) */
    .stage {
      position: absolute;
      left: 50%; top: 50%;
      width: 1366px; height: 1024px;
      overflow: visible;
      background: #000000;
      transform-origin: center center;
      transform: translate(-50%, -50%) scale(var(--scale, 1));
    }

    /* 화면 바깥으로 나간 그래픽을 완벽하게 가려주는 최상단 블랙 마스킹 레이어 (2000px 블랙 테두리) */
    .stage::after {
      content: '';
      position: absolute;
      inset: -2000px;
      border: 2000px solid #000000;
      pointer-events: none;
      z-index: 999999;
    }
    .stage-black-mask {
      position: absolute;
      background: #000000;
      pointer-events: none;
      z-index: 999999;
    }
    .stage-black-mask.mask-right {
      left: 1366px;
      top: -2000px;
      width: 4000px;
      height: 6000px;
    }
    .stage-black-mask.mask-left {
      right: 1366px;
      top: -2000px;
      width: 4000px;
      height: 6000px;
    }
    .stage-black-mask.mask-top {
      left: -2000px;
      bottom: 1024px;
      width: 6000px;
      height: 4000px;
    }
    .stage-black-mask.mask-bottom {
      left: -2000px;
      top: 1024px;
      width: 6000px;
      height: 4000px;
    }

    /* 각 장면 공통 */
    .scene {
      position: absolute; inset: 0;
      overflow: hidden;
      will-change: transform;
      backface-visibility: hidden;
      transform: translate3d(0, 0, 0);
    }

    .scene .bg {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      display: block;
    }

    /* 전환: 위로 슬라이드 (부드럽고 빠른 1.6s 커튼콜) */
    .scene.slide-up-out {
      animation: slideUpOut 1.6s cubic-bezier(0.25, 0.1, 0.25, 1) forwards;
      z-index: 10;
    }
    @keyframes slideUpOut {
      from { transform: translate3d(0, 0, 0); }
      to   { transform: translate3d(0, -100%, 0); }
    }

    
    /* 대화창 전용 부드러운 페이드 인 */
    .dialog-fade-in {
      animation: dialogFadeIn 0.6s ease forwards;
    }
    @keyframes dialogFadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    /* 전환: 페이드 (2분 무입력 시 대기화면 복귀) */
    .scene.fade-in {
      animation: fadeIn 0.8s ease forwards;
      z-index: 10;
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    /* ========== 대기화면(0번 장면 / Scene 1): 외벽 꽃 3개 살랑임 ========== */
    .flower {
      position: absolute;
      z-index: 1;
      pointer-events: none;
    }
    .f1, .flower.f1 { left: 957px; top: 178px; width: 219.5px; height: 229.5px; }
    .f2, .flower.f2 { left: 949px; top: 443px; width: 133px;   height: 145px;   }
    .f3, .flower.f3 { left: 985px; top: 615px; width: 172px;   height: 181px;   }

    .flower img {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      transform-origin: 50% 50%;
      animation: s01sway 2s steps(25) infinite alternate;
      backface-visibility: hidden;
      will-change: transform;
    }

    .f1 img, .flower.f1 img { --a: -5deg;   --b: 4deg; }
    .f2 img, .flower.f2 img { --a: 6deg;    --b: -4deg; }
    .f3 img, .flower.f3 img { --a: -3.5deg; --b: 5.5deg; }

    @keyframes s01sway {
      from { transform: rotate(var(--a)) translateZ(0); }
      to   { transform: rotate(var(--b)) translateZ(0); }
    }

    /* ========== 2장면: 비 내리는 책방 및 텍스트 ========== */
    .scene-02 .rain {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 1; /* 곱하기 투명도 레이어(.veil) 아래에 위치 */
    }

    .scene-02 .veil {
      position: absolute; inset: 0;
      background: #453E72;
      opacity: 0.9;
      mix-blend-mode: multiply;
      transition: opacity 2.4s ease;
      z-index: 2; /* 빗줄기 위에 위치하여 곱하기 블렌드 효과 적용 */
    }
    .scene-02 .veil.gone { opacity: 0; }

    @font-face {
      font-family: 'DungGeunMo';
      src: url('04_filters_fonts/DungGeunMo.otf') format('opentype');
    }

    .scene-02 .guide-text {
      position: absolute;
      left: 0; right: 0; top: 50%;
      transform: translateY(-50%);
      font-family: 'DungGeunMo', monospace;
      font-size: 42px;
      line-height: 1.6;
      color: #615CB7;
      text-align: center;
      white-space: nowrap;
      user-select: none;
      pointer-events: none;
      transition: opacity 2.4s ease;
      z-index: 3;
    }
    .scene-02 .guide-text.gone { opacity: 0; }
    .scene-02 .guide-text .ch {
      display: inline-block;
      visibility: hidden;
    }
    .scene-02 .guide-text .ch.on { visibility: visible; }

    /* ========== 3장면: 책방 앞 + 초록 대화창 & 대사 타이핑 ========== */
    .scene-03 .rain {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      pointer-events: none;
    }

    /* ========== 대화창 공통 스타일 & 텍스트 규칙 (가장 상단 레이어) ========== */
    .dialog-wrap {
      position: absolute;
      left: 0;
      right: -6px; /* 서브픽셀 렌더링 틈새를 완벽히 덮어 뒤편 그래픽/팔 노출 원천 차단 */
      bottom: 0;
      width: calc(100% + 6px);
      height: 216px;
      z-index: 100; /* 최상단 레이어 */
      pointer-events: none;
    }

    .dialog-wrap .dialog-bg {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      display: block;
    }

    .dialog-wrap .dialog-text {
      position: absolute;
      left: 65px; right: 65px; top: 0; bottom: 0;
      display: flex;
      align-items: center;
      font-family: 'DungGeunMo', monospace;
      font-size: 48px;
      letter-spacing: -0.5px;
      white-space: nowrap;
      user-select: none;
    }

    .dialog-wrap .dialog-body {
      color: #FFFAE1;
    }

    .dialog-wrap .ch {
      display: inline-block;
      visibility: hidden;
    }
    .dialog-wrap .ch.on {
      visibility: visible;
    }
    .dialog-wrap .ch.dim {
      opacity: 0.3;
    }

    /* 그린 텍스트 규칙 (You: #308DA4) */
    .dialog-wrap.green .speaker,
    .scene-03 .speaker,
    .scene-04 .speaker,
    .scene-09 .speaker,
    .scene-10 .speaker,
    .scene-12 .speaker,
    .scene-13 .speaker,
    .scene-16 .speaker,
    .scene-23 .speaker,
    .scene-24 .speaker,
    .scene-29 .speaker,
    .scene-30 .speaker,
    .scene-32 .speaker,
    .scene-33 .speaker,
    .scene-17 .speaker,
    .scene-37 .speaker,
    .scene-41 .speaker,
    .scene-42 .speaker,
    .scene-44 .speaker {
      color: #308DA4;
      margin-right: 14px;
    }

    /* 레드 텍스트 규칙 (P: #D13D79) */
    .dialog-wrap.red .speaker,
    .scene-05 .speaker,
    .scene-06 .speaker,
    .scene-26 .speaker,
    .scene-07 .speaker,
    .scene-08 .speaker,
    .scene-11 .speaker,
    .scene-13 .speaker,
    .scene-14 .speaker,
    .scene-15 .speaker,
    .scene-18 .speaker,
    .scene-38 .speaker,
    .scene-19 .speaker,
    .scene-39 .speaker,
    .scene-20 .speaker,
    .scene-40 .speaker,
    .scene-01 .speaker,
    .scene-21 .speaker,
    .scene-25 .speaker,
    .scene-27 .speaker,
    .scene-28 .speaker,
    .scene-31 .speaker,
    .scene-34 .speaker,
    .scene-35 .speaker,
    .scene-36 .speaker,
    .scene-41 .speaker,
    .scene-42 .speaker,
    .scene-43 .speaker {
      color: #D13D79;
      margin-right: 14px;
    }

    /* 퍼플 텍스트 규칙 및 보라색 대화창 배경 채움 (오른쪽 잘림 방지) */
    .dialog-wrap.purple {
      background: linear-gradient(
        to bottom,
        #702188 0px,
        #702188 34px,
        #4C105E 34px,
        #4C105E 182px,
        #702188 182px,
        #702188 216px
      );
    }
    .dialog-wrap.purple .dialog-bg {
      width: 100%;
      height: 100%;
      object-fit: fill;
    }
    .dialog-wrap.purple .speaker {
      color: #615CB7;
      margin-right: 14px;
    }

    
    
    /* S2 2장면 / 22장면: 형광등 깜빡거리며 켜지는 필터 (1366*809, #1D123D -> 투명도 0%) */
    .scene-02 .scene-flicker-filter,
    .scene-22 .scene-flicker-filter {
      position: absolute;
      left: 0;
      top: 0;
      width: 1366px;
      height: 809px;
      background-color: #1D123D;
      mix-blend-mode: multiply;
      pointer-events: none;
      z-index: 45;
      opacity: 0.90; /* 대사 나오는 동안 기본 어두운 방 유지 */
    }

    .scene-02.flicker-active .scene-flicker-filter,
    .scene-22.flicker-active .scene-flicker-filter,
    .flicker-active .scene-flicker-filter {
      animation: fluorescentFlicker 1.8s step-end forwards;
    }

    .scene-02 .lamp-flare,
    .scene-22 .lamp-flare {
      position: absolute;
      left: 0;
      top: 0;
      width: 1366px;
      height: 809px;
      background-color: #FFFDE8;
      pointer-events: none;
      z-index: 46;
      opacity: 0;
    }

    .scene-02.flicker-active .lamp-flare,
    .scene-22.flicker-active .lamp-flare,
    .flicker-active .lamp-flare {
      animation: lampFlare 1.8s step-end forwards;
    }

    @keyframes fluorescentFlicker {
      /* 어둑어둑한 분위기 유지 */
      0%   { opacity: 0.90; }
      12%  { opacity: 0.90; }

      /* 1차 미세 깜빡: 어둠 속에서 켜질랑말랑 살짝 꿈틀 (0.78) */
      18%  { opacity: 0.78; }
      24%  { opacity: 0.90; }

      /* 2차 켜질랑말랑: 조금 더 반응 (0.65) */
      40%  { opacity: 0.65; }
      45%  { opacity: 0.88; }

      /* 3차 전압 상승: 반쯤 깜빡 (0.45) */
      55%  { opacity: 0.45; }
      60%  { opacity: 0.78; }

      /* 4차 지직- 연속 스파크 (0.25 -> 0.58 -> 0.12) */
      68%  { opacity: 0.25; }
      73%  { opacity: 0.58; }
      78%  { opacity: 0.12; }
      82%  { opacity: 0.35; }

      /* 5차 점등 완료! 완전히 불 켜짐 */
      88%  { opacity: 0.00; }
      93%  { opacity: 0.10; } /* 전구 잔여 미세 진동 */
      97%  { opacity: 0.00; }
      100% { opacity: 0.00; } /* 영구 밝음 유지 */
    }

    @keyframes lampFlare {
      /* 초반 어둑어둑할 때는 섬광 없음 */
      0%   { opacity: 0; }
      67%  { opacity: 0; }

      /* 4차 스파크 시 미세 섬광 */
      78%  { opacity: 0.08; }
      82%  { opacity: 0; }

      /* 5차 본격 점등 시 찰나의 전등 빛 퍼짐 */
      88%  { opacity: 0.25; }
      94%  { opacity: 0; }
      100% { opacity: 0; }
    }

    /* 21장면 전용 필터 (1366*809 대화창 비침범 직사각형, #1D123D, multiply 90%) */
    .scene-01 .scene-21-filter,
    .scene-21 .scene-21-filter {
      position: absolute;
      left: 0;
      top: 0;
      width: 1366px;
      height: 809px;
      background-color: #1D123D;
      opacity: 0.9;
      mix-blend-mode: multiply;
      pointer-events: none;
      z-index: 45;
    }

    /* ========== S2 전체 장면 공통 컬러 필터 레이어 (#E8CBFF, 50%, multiply) ========== */
    .scene-color-filter {
      position: absolute;
      left: 0;
      top: 0;
      width: 1366px;
      height: 1024px;
      background-color: #E8CBFF;
      opacity: 0.5;
      mix-blend-mode: multiply;
      pointer-events: none;
      z-index: 50; /* 대화창(z-index: 100) 바로 아래, 씬 내 그래픽/모션 요소 최상단 */
    }
    .scene-color-filter.with-dialog,
    .scene:has(.dialog-wrap) .scene-color-filter {
      height: 809px; /* 하단 대사 영역을 제외한 상단 채움 (1366*809) */
    }

    /* ========== 4장면: 노크 장면 (배경, 도어 슬라이드, arm 마우스 커서, 타이핑) ========== */
    .scene-04 {
      cursor: none; /* 실제 마우스 커서 숨김 */
    }

    .rain {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      pointer-events: none;
    }

    .scene-04 .rain,
    .scene-05 .rain,
    .scene-06 .rain,
    .scene-11 .rain {
      z-index: 2; /* 꽃 레이어(z-index: 1) 위에서 비가 가림 없이 내리도록 설정 */
    }

    /* 4장면, 5장면, 6장면: 3장면(03.png) 꽃 위치와 100% 동일하게 일치시키는 꽃 레이어 */
    .flowers-layer {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 1;
    }
    .flowers-layer .flower-strip {
      position: absolute;
      top: 0; bottom: 0;
      overflow: hidden;
    }
    .flowers-layer .flower-strip.left {
      left: 0;
      width: 376px;
    }
    .flowers-layer .flower-strip.right {
      left: 925px;
      width: 441px;
    }
    .flowers-layer .flower-strip img {
      position: absolute;
      top: 0;
      width: 1366px;
      height: 1024px;
      display: block;
    }
    .flowers-layer .flower-strip.left img {
      left: 0;
    }
    .flowers-layer .flower-strip.right img {
      left: -925px;
    }

    /* 7장면, 8장면, 9장면: 비둘기 날개 (몸통 기준 안쪽 고정점, 위아래 살짝 날갯짓) */
    .pigeon-wing {
      position: absolute;
      width: 313.5px;
      height: 278.5px;
      z-index: 2;
      pointer-events: none;
      will-change: transform;
    }
    .pigeon-wing img {
      width: 100%;
      height: 100%;
      display: block;
    }
    .pigeon-wing.left {
      left: 165px;
      top: 430px;
      transform-origin: 90% 45%;
      animation: wingFlapLeft 1.44s steps(18) infinite alternate;
    }
    .pigeon-wing.right {
      right: 165px;
      top: 430px;
      transform-origin: 10% 45%;
      animation: wingFlapRight 1.44s steps(18) infinite alternate;
    }
    @keyframes wingFlapLeft {
      0%   { transform: rotate(-5deg); }
      100% { transform: rotate(5deg); }
    }
    @keyframes wingFlapRight {
      0%   { transform: rotate(5deg); }
      100% { transform: rotate(-5deg); }
    }

    /* 4장면 슬라이딩 도어 (24프레임 전개) */
    .scene-04 .door {
      position: absolute;
      left: 619.24px; top: 97.91px;
      z-index: 3;
      cursor: none;
      transition: transform 2.0s steps(48);
      will-change: transform;
    }
    .scene-04 .door img {
      display: block;
      width: auto;
      height: auto;
    }
    .scene-04 .door.opened {
      transform: translateX(-241.21px); /* x619.24 -> x378.03 으로 슬라이딩 이동 */
    }

    /* 건물 간판 정정 레이어 (知花冊房) */
    .sign-fixed {
      position: absolute;
      width: 61px;
      height: 247px;
      z-index: 2;
      pointer-events: none;
    }
    .sign-fixed img {
      width: 100%;
      height: 100%;
      display: block;
    }
    .scene-02 .sign-fixed {
      left: 924px;
      top: 235.5px;
    }
    .scene-03 .sign-fixed,
    .scene-04 .sign-fixed,
    .scene-05 .sign-fixed,
    .scene-06 .sign-fixed,
    .scene-11 .sign-fixed {
      left: 924px;
      top: 149.5px;
    }

    /* 15/16장면: 33번 장면 스타일 빈티지 땀방울 꿈틀 모션 (7~8fps 스톱모션 스타일) */
    .scene-15 .sweat-group,
    .scene-16 .sweat-group {
      position: absolute;
      left: 1086px;
      top: 148px;
      width: 161px;
      height: 121px;
      transform-origin: 50% 50%;
      pointer-events: none;
      z-index: 4;
      will-change: transform;
      animation: sweatVintageWriggle 0.72s steps(1) infinite;
    }
    .scene-15 .sweat-group img,
    .scene-16 .sweat-group img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
    }

    /* 5장면, 6장면, 11장면: 이전 장면에서 슬라이딩 완료된 문 유지 (x: 378.03px, y: 97.91px) */
    .scene-05 .door,
    .scene-06 .door,
    .scene-11 .door {
      position: absolute;
      left: 378.03px; top: 97.91px;
      z-index: 3;
    }
    .scene-05 .door img,
    .scene-06 .door img,
    .scene-11 .door img {
      display: block;
      width: auto;
      height: auto;
    }

    /* 12장면: 주인공(human) 클로즈업 레이어 및 비 레이어 */
    .scene-12 .rain {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 2;
    }
    .scene-12 .human {
      position: absolute;
      right: 0; top: 0;
      width: 1313px;
      height: 1024px;
      pointer-events: none;
      z-index: 3;
    }
    .scene-12 .human img {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* 13장면, 14장면, 15장면: 비 내리는 창가 비둘기 씬 (배경, 비, 비둘기 방 전경, 레드 대화창) */
    .scene-13 .rain,
    .scene-14 .rain,
    .scene-15 .rain {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 2;
    }
    .scene-13 .pigeon-room,
    .scene-14 .pigeon-room,
    .scene-15 .pigeon-room {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 3;
    }
    .scene-13 .pigeon-room img,
    .scene-14 .pigeon-room img,
    .scene-15 .pigeon-room img {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* 17장면: 비 내리는 창가 비둘기 씬 (배경, 비, 비둘기 방 전경, 상단 레드 대화창) */
    .scene-17 .rain {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 2;
    }
    .scene-17 .pigeon-room {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 3;
    }
    .scene-17 .pigeon-room img {
      width: 100%;
      height: 100%;
      display: block;
    }

      /* 12.5fps 스톱모션 (한 프레임 = 0.08s, 총 28프레임 = 2.24s) */
      /* 프레임 간 중간 보간 없이 각 프레임이 탁-탁 끊어지며 도약 */
      /* 0~2프레임: 바닥 준비 동작 */

      /* 1번째 칸 도약 (3~7프레임): 발을 떼고 1단 위로 톡 뜀 */
      11%  { transform: translate3d(0, -45px, 0) scale(0.97); opacity: 1; }
      14%  { transform: translate3d(0, -115px, 0) scale(0.93); opacity: 1; }
      18%  { transform: translate3d(0, -155px, 0) scale(0.90); opacity: 1; }
      21%  { transform: translate3d(0, -135px, 0) scale(0.89); opacity: 1; }
      25%  { transform: translate3d(0, -121px, 0) scale(0.88); opacity: 1; }

      /* 1단 위 안착 및 호흡 (8~11프레임) */
      29%  { transform: translate3d(0, -121px, 0) scale(0.88); opacity: 1; }
      39%  { transform: translate3d(0, -121px, 0) scale(0.88); opacity: 1; }

      /* 2번째 칸 도약 (12~16프레임): 중간 계단으로 톡 뜀 */
      43%  { transform: translate3d(0, -165px, 0) scale(0.85); opacity: 1; }
      46%  { transform: translate3d(0, -235px, 0) scale(0.82); opacity: 1; }
      50%  { transform: translate3d(0, -275px, 0) scale(0.79); opacity: 1; }
      54%  { transform: translate3d(0, -255px, 0) scale(0.78); opacity: 1; }
      57%  { transform: translate3d(0, -243px, 0) scale(0.78); opacity: 1; }

      /* 대사 출력 타이밍에 맞춰 계단 중간에 정지 유지 (17~28프레임) */
      61%  { transform: translate3d(0, -243px, 0) scale(0.78); opacity: 1; }
      100% { transform: translate3d(0, -243px, 0) scale(0.78); opacity: 1; }
    }

  <main id="stage" class="stage">
    <h1 class="sr-only">知花冊房</h1>

  <script>
    window.TOTAL_SCENES = 70; // 최종 완성 시 총 장면 수로 일괄 변경 가능
    /* ==============================================================
       [S2 브릿지 시작 장면] 장면 20 (서점 카운터 비둘기 맞이 씬)
       ============================================================== */
        /* ==============================================================
       [S2 1장면 / 첫 장면] 서재 안 도착 씬 (#1D123D 90% multiply 필터 + 레드 대화창)
       ============================================================== */
    window.SCENES = window.SCENES || {};
    window.SCENES[1] = {
      mount(el, app) {
        el.innerHTML = `
          <img class="bg" src="01_backgrounds/pigeon_desk_base.png" alt="">
          <div class="scene-21-filter"></div>
          <div class="dialog-wrap red">
            <img class="dialog-bg" src="02_motions/06 Red text background .png" alt="">
            <div class="dialog-text">
              <span class="speaker"></span>
              <span class="dialog-body"></span>
            </div>
          </div>
        `;

        // 레드 텍스트 규칙: P: (#D13D79) / 대사 (#FFFAE1, 48px, DungGeunMo)
        const speakerEl = el.querySelector('.speaker');
        const bodyEl = el.querySelector('.dialog-body');
        const typing = typeDialog(
          speakerEl,

            const leftNum = (currentPage - 1) * 2 + 1;
            const rightNum = (currentPage - 1) * 2 + 2;

          const clampedStep = Math.max(0, Math.min(totalSteps, targetStep));

          window.removeEventListener('mouseup', onProgressMouseUp);

          window.addEventListener('touchcancel', onProgressTouchEnd);

        const onProgressTouchMove = (e) => {
          if (!isDraggingProgress || e.touches.length !== 1) return;
          e.preventDefault();
          seekByClientX(e.touches[0].clientX);
        };

          if (!isDraggingProgress) return;

          window.removeEventListener('touchend', onProgressTouchEnd);
          window.removeEventListener('touchcancel', onProgressTouchEnd);

/* ---------- 웹 오디오 형광등 점등 효과음 (스위치 딸깍 + 초크 스타터 지직- 스파크 + 점등 험) ---------- */
    function playSwitchSound() {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        if (ctx.state === 'suspended') {
          ctx.resume();
        }
        const now = ctx.currentTime;

        // 1. 벽면 스위치 찰칵 (2회 연속 물리 스위치 타격음)
        function playSwitchClick(time, freq, dur, vol) {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, time);
          osc.frequency.exponentialRampToValueAtTime(70, time + dur);
          gain.gain.setValueAtTime(vol || 0.35, time);
          gain.gain.exponentialRampToValueAtTime(0.001, time + dur);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(time);
          osc.stop(time + dur);
        }
        playSwitchClick(now, 950, 0.016, 0.35);
        playSwitchClick(now + 0.022, 540, 0.025, 0.28);

        // 2. 형광등 초크 스타터 방전 스파크 (치직- 츠츠-)
        function playSparkNoise(time, dur, vol, filterFreq) {
          const bufferSize = Math.max(1, Math.floor(ctx.sampleRate * dur));
          const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
          const data = buffer.getChannelData(0);
          for (let i = 0; i < bufferSize; i++) {
            data[i] = (Math.random() * 2 - 1);
          }
          const noise = ctx.createBufferSource();
          noise.buffer = buffer;

          const filter = ctx.createBiquadFilter();
          filter.type = 'bandpass';
          filter.frequency.setValueAtTime(filterFreq || 1800, time);
          filter.Q.setValueAtTime(2.0, time);

          const gain = ctx.createGain();
          gain.gain.setValueAtTime(vol, time);
          gain.gain.exponentialRampToValueAtTime(0.001, time + dur);

          noise.connect(filter);
          filter.connect(gain);
          gain.connect(ctx.destination);
          noise.start(time);
        }

        // 형광등 깜빡임 키프레임과 싱크된 방전 스파크 (18%, 40%, 68%~82%)
        playSparkNoise(now + 0.32, 0.035, 0.18, 1700); // 1차 깜빡
        playSparkNoise(now + 0.70, 0.040, 0.22, 1900); // 2차 깜빡
        playSparkNoise(now + 0.76, 0.030, 0.16, 1600);
        playSparkNoise(now + 1.22, 0.040, 0.26, 2100); // 4차 연속 스파크
        playSparkNoise(now + 1.30, 0.045, 0.30, 1800);
        playSparkNoise(now + 1.40, 0.038, 0.25, 2200);
        playSparkNoise(now + 1.47, 0.050, 0.32, 1600);

        // 3. 점등 완료 찰나(1.58s): 램프 점등 충격음 + 안정기 전압 험(웅-)
        playSwitchClick(now + 1.58, 420, 0.045, 0.25);

        const humOsc = ctx.createOscillator();
        const humGain = ctx.createGain();
        humOsc.type = 'sawtooth';
        humOsc.frequency.setValueAtTime(120, now + 1.58);

        const humFilter = ctx.createBiquadFilter();
        humFilter.type = 'lowpass';
        humFilter.frequency.setValueAtTime(280, now + 1.58);

        humGain.gain.setValueAtTime(0.001, now + 1.58);
        humGain.gain.linearRampToValueAtTime(0.12, now + 1.62);
        humGain.gain.exponentialRampToValueAtTime(0.001, now + 2.15);

        humOsc.connect(humFilter);
        humFilter.connect(humGain);
        humGain.connect(ctx.destination);
        humOsc.start(now + 1.58);
        humOsc.stop(now + 2.15);

      } catch (e) {
        console.warn('Switch sound error:', e);
      }
    }

    /* ---------- 웹 오디오 노크 효과음 합성 재생 (똑-똑) ---------- */
    function playKnockSound() {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();

        function singleKnock(time, freq) {
          const osc = ctx.createOscillator();
          const oscGain = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, time);
          osc.frequency.exponentialRampToValueAtTime(freq * 0.25, time + 0.09);

          oscGain.gain.setValueAtTime(0.85, time);
          oscGain.gain.exponentialRampToValueAtTime(0.001, time + 0.09);

          osc.connect(oscGain);
          oscGain.connect(ctx.destination);

          osc.start(time);
          osc.stop(time + 0.09);

          const bufferSize = Math.floor(ctx.sampleRate * 0.025);
          const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
          const data = buffer.getChannelData(0);
          for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

          const noise = ctx.createBufferSource();
          noise.buffer = buffer;
          const noiseFilter = ctx.createBiquadFilter();
          noiseFilter.type = 'lowpass';
          noiseFilter.frequency.setValueAtTime(900, time);

          const noiseGain = ctx.createGain();
          noiseGain.gain.setValueAtTime(0.95, time);
          noiseGain.gain.exponentialRampToValueAtTime(0.01, time + 0.025);

          noise.connect(noiseFilter);
          noiseFilter.connect(noiseGain);
          noiseGain.connect(ctx.destination);

          noise.start(time);
          noise.stop(time + 0.025);
        }

        const now = ctx.currentTime;
        singleKnock(now + 0.16, 175);
        singleKnock(now + 0.38, 165);
      } catch (e) {
        console.warn('Knock sound error:', e);
      }
    }

    /* ---------- 타이핑 모션 (기본 텍스트 출력) ---------- */
    function typeText(el, lines, speed = 32, startDelay = 1700) {
      const chars = [];
      lines.forEach((line, li) => {
        if (li) el.appendChild(document.createElement('br'));
        for (const c of line) {
          const s = document.createElement('span');
          s.className = 'ch';
          s.textContent = c === ' ' ? '\u00A0' : c;
          el.appendChild(s);
          chars.push(s);
        }
      });

      let i = 0, timer = 0;
      const step = () => {
        if (i >= chars.length) return;
        chars[i++].classList.add('on');
        timer = setTimeout(step, speed);
      };
      timer = setTimeout(step, startDelay);

      return {
        finish() { clearTimeout(timer); chars.forEach((c) => c.classList.add('on')); i = chars.length; },
        stop() { clearTimeout(timer); },
      };
    }

    /* ---------- 대사 타이핑 모션 (화자 + 대사 순차 출력) ---------- */
    function typeDialog(speakerEl, speakerText, bodyEl, bodyText, speed = 45, startDelay = 400, options = {}) {
      const chars = [];
      const dimParen = options.dimParen !== false;
      const onComplete = options.onComplete;
      let completedFired = false;

      const fireComplete = (isImmediate = false) => {
        if (!completedFired) {
          completedFired = true;
          if (typeof onComplete === 'function') {
            onComplete(isImmediate);
          }
        }
      };

      // 화자 (You: / P:)
      for (const c of speakerText) {
        const s = document.createElement('span');
        s.className = 'ch';
        s.textContent = c === ' ' ? '\u00A0' : c;
        speakerEl.appendChild(s);
        chars.push(s);
      }

      // 대사 내용
      let inParen = false;
      for (const c of bodyText) {
        if (dimParen && c === '(') inParen = true;
        const s = document.createElement('span');
        s.className = (dimParen && inParen) ? 'ch dim' : 'ch';
        s.textContent = c === ' ' ? '\u00A0' : c;
        bodyEl.appendChild(s);
        chars.push(s);
        if (dimParen && c === ')') inParen = false;
      }

      let i = 0, timer = 0;
      let finished = false;

      const step = () => {
        if (i >= chars.length) {
          finished = true;
          fireComplete(false);
          return;
        }
        chars[i++].classList.add('on');
        if (typeof options.onChar === 'function') {
          options.onChar(i, chars.length);
        }
        timer = setTimeout(step, speed);
      };
      timer = setTimeout(step, startDelay);

      return {
        isFinished: () => finished,
        finish() {
          clearTimeout(timer);
          chars.forEach((c) => c.classList.add('on'));
          i = chars.length;
          finished = true;
          fireComplete(true);
        },
        stop() {
          clearTimeout(timer);
        },
      };
    }

    /* ---------- 빗줄기 애니메이션 (12.5fps 스톱모션) ---------- */
    function startRain(canvas, options = {}) {
      const ctx = canvas.getContext('2d');
      const W = canvas.width, H = canvas.height;
      const img = new Image();
      img.src = '02_motions/02-07, 12-13 rain line .png';

      const BASE_W = 45, BASE_H = 59.5;
      const SPEED = 12;
      // 배경 요소의 상단 이동 오프셋 (2장면: 0, 3~6, 11장면: -85px)
      const noMask = options.noMask === true;
      const offsetY = options.offsetY ?? 0;
      const buildingLeft = 379;
      const buildingRight = 899;
      const signLeft = 898;
      const signRight = 1015;
      const buildingTop = 165 + offsetY;
      const buildingBottom = 840 + offsetY;
      const signTop = 205 + offsetY;
      const signBottom = 516 + offsetY;
      const bottomY = 825 + offsetY;

      const COUNT = 60;
      const TOTAL_SPAN = W + 700;
      const START_X = -100;
      const drops = [];
      const MIN_DX = 24;
      const MIN_DY = 130;

      for (let i = 0; i < COUNT; i++) {
        let bestX = 0, bestY = 0;
        let found = false;
        for (let attempt = 0; attempt < 80; attempt++) {
          const testX = START_X + Math.random() * TOTAL_SPAN;
          const testY = Math.random() * (H + BASE_H * 2) - BASE_H;
          const overlapped = drops.some((d) => {
            const dx = Math.abs(d.originX - testX);
            const dy = Math.abs(d.y - testY);
            return dx < MIN_DX && dy < MIN_DY;
          });
          if (!overlapped) {
            bestX = testX; bestY = testY; found = true; break;
          }
        }
        if (!found) { bestX = START_X + Math.random() * TOTAL_SPAN; bestY = Math.random() * H; }
        const rot = -(37.1 + (Math.random() * 4 - 2)) * Math.PI / 180;
        const driftRatio = Math.tan(Math.abs(rot));
        drops.push({
          x: bestX, y: bestY, originX: bestX,
          resetY: -(Math.random() * 150 + BASE_H),
          rot, driftRatio
        });
      }

      const FPS = 12.5, STEP = 1000 / FPS;
      let raf = 0, last = performance.now();
      const tick = (now) => {
        raf = requestAnimationFrame(tick);
        if (now - last < STEP) return;
        const dt = Math.min((now - last) / 16.67, 12);
        last = now;
        ctx.clearRect(0, 0, W, H);
        if (img.complete && img.naturalWidth) {
          const moveY = SPEED * dt;
          for (const d of drops) {
            d.y += moveY;
            d.x += SPEED * d.driftRatio * dt;
            if (d.y > H + BASE_H) {
              d.y = d.resetY;
              d.x = d.originX + (d.y / SPEED) * (SPEED * d.driftRatio);
            }
            // [침범 방지 1차] 건물 본체, 간판, 바닥 영역에 닿으면 생략 (간판 아래 영역은 통과하여 비가 내림)
            if (!noMask) {
              const inMain = (d.x >= buildingLeft && d.x <= buildingRight && d.y >= buildingTop && d.y <= buildingBottom);
              const inSign = (d.x >= signLeft && d.x <= signRight && d.y >= signTop && d.y <= signBottom);
              const inBottom = (d.y >= bottomY);
              if (inMain || inSign || inBottom) continue;
            }
            ctx.save();
            ctx.translate(d.x, d.y);
            ctx.rotate(d.rot);
            ctx.drawImage(img, -BASE_W / 2, -BASE_H / 2, BASE_W, BASE_H);
            ctx.restore();
          }
          if (!noMask) {
            // [침범 방지 2차] 건물 본체, 간판, 바닥 영역 마스킹 (간판 아래 영역은 마스킹하지 않아 비가 내림)
            ctx.save();
            ctx.globalCompositeOperation = 'destination-out';
            ctx.fillRect(buildingLeft, buildingTop, buildingRight - buildingLeft, buildingBottom - buildingTop);
            ctx.fillRect(signLeft, signTop, signRight - signLeft, signBottom - signTop);
            ctx.fillRect(0, bottomY, W, H - bottomY);
            ctx.restore();
          }
        }
      };
      raf = requestAnimationFrame(tick);
      return () => cancelAnimationFrame(raf);
    }

    /* ==============================================================
       장면 관리자 & 스케일러 (1366x1024 유지 + 2분 무입력 시 1장면 복귀)
       ============================================================== */
    (() => {
      const stage = document.getElementById('stage');
      const W = 1366, H = 1024;
      const IDLE_MS = 2 * 60 * 1000;

      // 비율 유지 스케일
      const fit = () => {
        stage.style.setProperty('--scale', Math.min(innerWidth / W, innerHeight / H));
      };
      addEventListener('resize', fit);
      fit();

      let current = null;

      function goTo(n, transition = 'none') {
        const def = window.SCENES[n];
        if (!def) { console.warn('장면 없음:', n); return; }

        const el = document.createElement('section');
        const numPad = String(n).padStart(2, '0');
        const altNumPad = (n >= 21 && n <= 40) ? String(n - 20).padStart(2, '0') : (n >= 1 && n <= 20 ? String(n + 20).padStart(2, '0') : '');
        el.className = `scene scene-${numPad} ${altNumPad ? `scene-${altNumPad}` : ''}`.trim();
        const prev = current;

        // 새 씬 마운트 및 조립(대화창 카운터, 필터)을 DOM 삽입 전에 완료하여 화면 깜빡임/번쩍임 완전 방지
        current = { n, el, scene: null };
        current.scene = def.mount(el, api) || {};

        // 대화창 맨 아래 줄 또는 대화창 없는 화면의 최상단 레이어에 '현재장면/70' 번호 표기 자동 부착
        // 단, 책 읽는 화면(47장면 등)은 화면 넘버링에서 완전 제외
        const isReader = (n === 47 || def.isReader === true || el.classList.contains('scene-47'));
        if (!isReader) {
          const sceneNum = (n >= 1 && n <= 20) ? (n + 20) : n;
          const dialogWraps = el.querySelectorAll('.dialog-wrap');
          if (dialogWraps.length > 0) {
            dialogWraps.forEach((dw) => {
              if (!dw.querySelector('.scene-counter')) {
                const counterEl = document.createElement('div');
                counterEl.className = 'scene-counter';
                counterEl.textContent = `${sceneNum}/70`;
                dw.appendChild(counterEl);
              }
            });
          } else {
            if (!el.querySelector('.scene-counter')) {
              const counterEl = document.createElement('div');
              counterEl.className = 'scene-counter';
              counterEl.textContent = `${sceneNum}/70`;
              el.appendChild(counterEl);
            }
          }
        }

        // S2 모든 장면에 공통 컬러 필터 레이어 (#E8CBFF, 50%, multiply) 최상위 배치
        const hasDialog = !!el.querySelector('.dialog-wrap');
        const filter = document.createElement('div');
        filter.className = `scene-color-filter ${hasDialog ? 'with-dialog' : 'full'}`;
        el.appendChild(filter);

        if (transition === 'slideUp' && prev) {
          stage.insertBefore(el, prev.el);
          prev.el.classList.add('slide-up-out');
          prev.el.addEventListener('animationend', () => destroy(prev), { once: true });
        } else if (transition === 'fade' && prev) {
          el.classList.add('fade-in');
          stage.appendChild(el);

          // 비둘기 눈썹: 페이드아웃 대신 즉시바뀜 연출
          const prevEb = prev.el.querySelector('.pigeon-eyebrows');
          if (prevEb) prevEb.style.display = 'none';

          const newEb = el.querySelector('.pigeon-eyebrows');
          let tempEb = null;
          if (newEb) {
            tempEb = newEb.cloneNode(true);
            tempEb.classList.add('instant-eyebrow-clone');
            stage.appendChild(tempEb);
          }

          let done = false;
          const finishFade = () => {
            if (done) return;
            done = true;
            el.classList.remove('fade-in');
            if (tempEb) tempEb.remove();
            destroy(prev);
          };
          el.addEventListener('animationend', finishFade, { once: true });
          setTimeout(finishFade, 900); // 0.8s 페이드 안전 타이머
        } else {
          stage.appendChild(el);
          if (prev) destroy(prev);
        }

        resetIdle();
      }

      function destroy(s) {
        if (s.scene && s.scene.unmount) s.scene.unmount();
        s.el.remove();
      }

      const api = {
        goTo,
        next: (transition) => {
          if (current && (current.n === 20 || current.n === 40)) return goTo(41, transition);
          return goTo(current.n + 1, transition);
        },
        prev: (transition) => {
          if (current && current.n === 41) return goTo(20, transition);
          return goTo(Math.max(1, current.n - 1), transition);
        },
        openReader: (bookIdx = 1) => {
          window.CURRENT_BOOK_ID = bookIdx;
          goTo(47, 'fade');
        },
        get current() { return current && current.n; },
      };
      window.App = api;

      // 마우스 우클릭 시 이전 장면으로 이동
      window.addEventListener('contextmenu', (e) => {
        e.preventDefault();
        if (current && current.n > 1) {
          api.prev('fade');
        }
      });

      // 2분 무입력 타이머
      let idleTimer = null;
      function resetIdle() {
        clearTimeout(idleTimer);
        idleTimer = setTimeout(() => {
          if (current && current.n !== 1) goTo(1, 'fade');
        }, IDLE_MS);
      }
      ['mousemove', 'mousedown', 'keydown', 'touchstart', 'wheel'].forEach((ev) =>
        addEventListener(ev, resetIdle, { passive: true })
      );

      const urlScene = parseInt(new URLSearchParams(location.search).get('scene'));
      goTo(urlScene || 1);
    })();
  </script>
